<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg4)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="50" x2="600" y2="50" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="250" x2="600" y2="250" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="350" x2="600" y2="350" stroke="#34d399" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#34d399" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#34d399" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#34d399" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#34d399" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#34d399" stroke-width="1"/>
  </g>
  
  <!-- Ticket icon -->
  <g transform="translate(250, 100)">
    <circle cx="50" cy="80" r="90" fill="url(#accent4)" opacity="0.15"/>
    <!-- Ticket stub -->
    <path d="M15,45 L15,55 Q15,60 10,60 Q15,60 15,65 L15,115 Q15,120 10,120 Q15,120 15,125 L15,135 Q15,140 20,140 L80,140 Q85,140 85,135 L85,125 Q85,120 90,120 Q85,120 85,115 L85,65 Q85,60 90,60 Q85,60 85,55 L85,45 Q85,40 80,40 L20,40 Q15,40 15,45 Z"
          fill="none" stroke="url(#accent4)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Perforation notches -->
    <circle cx="15" cy="90" r="4" fill="#1a1a2e" stroke="url(#accent4)" stroke-width="2"/>
    <circle cx="85" cy="90" r="4" fill="#1a1a2e" stroke="url(#accent4)" stroke-width="2"/>
    <!-- Event lines -->
    <line x1="28" y1="58" x2="72" y2="58" stroke="#34d399" stroke-width="2" opacity="0.7"/>
    <line x1="28" y1="72" x2="55" y2="72" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="28" y1="86" x2="65" y2="86" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="28" y1="100" x2="50" y2="100" stroke="#34d399" stroke-width="2" opacity="0.5"/>
    <!-- QR-style block -->
    <rect x="58" y="108" width="18" height="18" rx="2" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
    <rect x="62" y="112" width="4" height="4" fill="#34d399" opacity="0.8"/>
    <rect x="68" y="112" width="4" height="4" fill="#6366f1" opacity="0.8"/>
    <rect x="62" y="118" width="4" height="4" fill="#6366f1" opacity="0.8"/>
  </g>
  
  <!-- Label -->
  <rect x="155" y="300" width="290" height="45" rx="20" fill="url(#accent4)" opacity="0.9"/>
  <text x="300" y="330" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">LaraTicket</text>
</svg>
